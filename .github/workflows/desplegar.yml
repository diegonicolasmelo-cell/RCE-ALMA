name: Desplegar

# Publica la PWA en GitHub Pages. Requiere activar Settings -> Pages -> Source: GitHub Actions.
# La URL del backend y los tokens NO van aqui: se entregan por enlace de configuracion
# (ver backend/apps-script/README.md). Opcional: variable de repositorio SINAPSE_URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SINAPSE_URL: ${{ vars.SINAPSE_URL }}
          VITE_EXIGIR_CONFIG: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Lo que se pega en el editor de Apps Script (index.html en formato cohete y Codigo.gs).
      # Queda como descarga privada de este run: Actions -> ultimo "Desplegar" -> Artifacts.
      - run: npm run gas
      - uses: actions/upload-artifact@v4
        with:
          name: apps-script-${{ github.sha }}
          path: |
            dist-gas/index.html
            dist-gas/Codigo.gs
            dist-gas/LEEME.txt
          retention-days: 30
          if-no-files-found: error

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
