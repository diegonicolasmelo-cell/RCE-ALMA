name: Verificar

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tipos y tests del nucleo clinico, de la capa de datos y de la estacion.
      - run: npm run check
      - run: npm run build
