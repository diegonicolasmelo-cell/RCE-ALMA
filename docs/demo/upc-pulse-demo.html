<title>UPC-Pulse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concepto: tablero clínico sobrio. Neutros fríos, un solo acento azul, semáforo clínico
   reservado para estados. Naranja marca solo "idea de tu colega". Datos en mono tabular. */
:root{
  --bg:#eef1f4; --panel:#fcfcfb; --panel-2:#f3f5f7; --ink:#0f1a24; --ink-2:#465463; --muted:#7a8794;
  --line:#dde3e9; --accent:#2a78d6; --accent-soft:#e3eefb; --on-accent:#ffffff;
  --new:#eb6834; --new-soft:#fdece4; --new-ink:#a33e12;
  --good:#0ca30c; --good-ink:#006300; --good-soft:#e6f5e6;
  --warn:#fab219; --warn-ink:#7a5200; --warn-soft:#fff4d9;
  --serious:#ec835a; --crit:#d03b3b; --crit-ink:#b02a2a; --crit-soft:#fbe9e9;
  --bezel:#1b242c; --shadow:0 1px 2px rgba(15,26,36,.06),0 8px 24px rgba(15,26,36,.08);
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --panel:#161c22; --panel-2:#1c242b; --ink:#eaeef2; --ink-2:#b7c1cb; --muted:#8895a2;
  --line:#2a343d; --accent:#3987e5; --accent-soft:#16283d; --new:#d95926; --new-soft:#33211a; --new-ink:#f0a483;
  --good:#0ca30c; --good-ink:#4cc84c; --good-soft:#15301a; --warn:#fab219; --warn-ink:#fab219; --warn-soft:#352b12;
  --crit:#d03b3b; --crit-ink:#ef7676; --crit-soft:#3a1d1d; --bezel:#05080b; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --panel:#161c22; --panel-2:#1c242b; --ink:#eaeef2; --ink-2:#b7c1cb; --muted:#8895a2;
  --line:#2a343d; --accent:#3987e5; --accent-soft:#16283d; --new:#d95926; --new-soft:#33211a; --new-ink:#f0a483;
  --good:#0ca30c; --good-ink:#4cc84c; --good-soft:#15301a; --warn:#fab219; --warn-ink:#fab219; --warn-soft:#352b12;
  --crit:#d03b3b; --crit-ink:#ef7676; --crit-soft:#3a1d1d; --bezel:#05080b; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;
  padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
h2{font-size:15px;font-weight:700;margin:0 0 8px;text-wrap:balance}
h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
p{margin:0}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.brand small{display:block;color:var(--ink-2);font-size:13px;font-weight:500;margin-top:2px}
.demo-tag{font-size:12px;font-weight:600;color:var(--new-ink);background:var(--new-soft);padding:4px 10px;border-radius:999px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--ink-2);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{color:var(--ink-2);max-width:72ch;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good-ink)} .pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.crit{background:var(--crit-soft);color:var(--crit-ink)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.new{background:var(--new-soft);color:var(--new-ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.serious{background:var(--serious)} .dot.crit{background:var(--crit)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-weight:600;cursor:pointer;min-height:38px;font-family:var(--font-data);font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.apoyo{border-style:dashed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:12px}
.tag-new{font-size:11px;font-weight:700;color:var(--new-ink);background:var(--new-soft);border-left:3px solid var(--new);padding:1px 7px;border-radius:2px;margin-left:6px;vertical-align:middle;white-space:nowrap}

/* celular */
.celular{display:grid;grid-template-columns:minmax(0,392px) minmax(0,1fr);gap:24px;align-items:start}
.phone{width:100%;max-width:392px;height:780px;background:var(--panel);border:10px solid var(--bezel);border-radius:34px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.ph-top label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.airway{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}
.airway b{font-size:16px}
.ph-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.ph-tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 2px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
.ph-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ph-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.ph-save{padding:8px 14px;border-top:1px solid var(--line);background:var(--panel)}
.ph-save .btn{width:100%;min-height:46px;font-size:15px}
.ph-beds{display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));overflow-x:auto;border-top:1px solid var(--line);background:var(--panel-2)}
.ph-beds .chip{flex:none;padding:7px 10px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f label{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:3px}
.f input,.f select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 8px;font-family:var(--font-data);font-size:15px;min-height:42px;text-align:center}
.f input::placeholder{color:var(--muted);opacity:.65}
.f input[disabled]{background:var(--panel-2);border-style:dashed;color:var(--muted)}
#in-plat[disabled]{background:var(--crit-soft);color:var(--crit-ink)}
.f select{text-align:left;font-family:var(--font-ui);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:8px 14px;font-weight:700;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.derived{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel-2);border-radius:9px;padding:8px}
.derived div{text-align:center} .derived b{display:block;font-family:var(--font-data);font-size:15px} .derived span{font-size:10.5px;color:var(--ink-2);font-weight:600}
.notice{border-radius:9px;padding:9px 11px;font-size:13px}
.notice.crit{background:var(--crit-soft);color:var(--crit-ink)} .notice.good{background:var(--good-soft);color:var(--good-ink)}
.notice.warn{background:var(--warn-soft);color:var(--warn-ink)} .notice.acc{background:var(--accent-soft);color:var(--ink)}
.notice.new{background:var(--new-soft);border-left:3px solid var(--new);color:var(--ink)}
.escalones{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.escalones .chip{padding:6px 0;text-align:center}
.sas{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sas .chip{padding:6px 0;text-align:center}
.apk-text{font-size:13px;background:var(--panel-2);border-radius:9px;padding:10px 12px}
details.crit-list{border:1px solid var(--line);border-radius:9px;padding:8px 12px}
details.crit-list summary{cursor:pointer;font-weight:600;font-size:13px}
details.crit-list ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.timer{font-family:var(--font-data);font-size:26px;font-weight:600}

.pickbtn{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:42px;font-weight:700;font-size:14px;text-align:left;padding:0 10px;cursor:pointer}
.pickbtn::after{content:"\25BE";float:right;color:var(--muted)}
.kb{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--panel-2);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.14)}
.qstrip{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.qlbl{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;margin-right:2px}
.qchip{flex:none;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 14px;min-height:40px;font-family:var(--font-data);font-weight:600;font-size:14px;cursor:pointer}
.qchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qchip.prev{border-style:dashed}
.qchip.nxt{background:none;color:var(--accent);border-color:transparent}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.keys button{min-height:46px;border:0;border-radius:8px;background:var(--panel);font-family:var(--font-data);font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.keys .done{grid-column:1/-1;background:var(--accent);color:var(--on-accent);font-family:var(--font-ui);font-size:15px}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;padding:8px 6px}
.pickbtn.cur{outline:2px solid var(--accent);outline-offset:1px}
.pam{border:1px dashed var(--line);border-radius:8px;min-height:42px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:var(--panel-2)}
.infu{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
.infu.on{border-color:var(--accent)}
.infu-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.infu-b{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.f.inl{display:flex;align-items:center;gap:6px;margin-left:auto}
.f.inl input{width:76px;min-height:36px;padding:6px 4px}
.btn.play{color:var(--good-ink)}.btn.stop{color:var(--crit-ink)}
.btn svg{vertical-align:-1px;margin-right:4px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.st{border:1px solid var(--line);border-radius:6px;padding:4px 0;text-align:center;font-style:normal;background:var(--panel-2);color:var(--muted)}
.st b{display:block;font-family:var(--font-data);font-size:14px}
.st small{display:block;font-family:var(--font-data);font-size:10px}
.st.f{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.st.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:12px;padding:6px 0 0;cursor:pointer}
.qchip small{display:block;font-size:9.5px;font-weight:500;opacity:.8}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.evgrid .btn{text-align:left;font-size:13px;padding:8px 10px}
.btn.danger-o{border-color:var(--crit);color:var(--crit-ink)}
.side-note{display:flex;flex-direction:column;gap:14px}
.mirror{border:1px dashed var(--line)}

/* PC */
.pc-bar{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;margin-bottom:12px}
.camas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.cama{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left}
.cama.mini{border:0;padding:0;cursor:default;background:none;box-shadow:none}
.cama[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cama.alerta{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit-soft)}
.cama header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cama .id{font-family:var(--font-data);font-weight:600;font-size:15px}
.cama .nm{font-weight:700}
.cama .meta{color:var(--ink-2);font-size:13px}
.cama .pills{display:flex;flex-wrap:wrap;gap:5px}
.detail{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.detail-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.sparks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.spark{background:var(--panel-2);border-radius:10px;padding:10px 12px;position:relative}
.spark .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink-2)}
.spark .val{font-family:var(--font-data);font-size:20px;font-weight:600;margin:2px 0}
.spark svg{display:block;width:100%;height:56px;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.sab{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
table.sab th,table.sab td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.sab th:first-child,table.sab td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:600;color:var(--ink-2)}
table.sab thead th{background:var(--panel-2);font-family:var(--font-data)}
table.sab td.v{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.lockc{color:var(--crit-ink);display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600}
pre.nota{margin:0;white-space:pre-wrap;font-family:var(--font-data);font-size:12.5px;line-height:1.55;background:var(--panel-2);border-radius:10px;padding:12px 14px;max-height:420px;overflow:auto}
.alma{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
.step-val{font-family:var(--font-data);font-size:34px;font-weight:600;word-break:break-word;margin:4px 0 2px}
.bar{height:6px;background:var(--panel-2);border-radius:999px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent)}
.flist{list-style:none;margin:0;padding:0;font-size:13px}
.flist li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.flist li.on{font-weight:700;color:var(--accent)} .flist li.done{color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.flow .node{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.flow .node h2{display:flex;align-items:center;gap:8px}
.sheet{font-family:var(--font-data);font-size:12px}
.keyline{font-family:var(--font-data);font-size:12px;background:var(--panel-2);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow);z-index:20;max-width:calc(100vw - 32px)}
@media (max-width:900px){.celular,.alma{grid-template-columns:minmax(0,1fr)}.phone{margin-inline:auto}}
@media (prefers-reduced-motion:no-preference){.cama,.btn,.chip{transition:background .12s,border-color .12s}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>UPC-Pulse</h1>
      <small>Captura a pie de cama · tablero en el PC · evolución para ALMA</small>
    </div>
    <span class="demo-tag">Demo con datos inventados · nada se guarda</span>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="celular">1 · Celular</button>
    <button class="tab" role="tab" data-tab="tablero">2 · PC: tablero</button>
    <button class="tab" role="tab" data-tab="alma">3 · PC: Para ALMA</button>
    <button class="tab" role="tab" data-tab="datos">4 · Dónde viven los datos</button>
  </div>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const fmt=v=>v===null||v===undefined||v===''?'--':String(v);
const pad2=n=>String(n).padStart(2,'0');
const hhmm=ts=>{const d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const ic={
  lock:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
  play:'<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>',
  stop:'<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>',
  alert:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 6.5v3M8 11.6v.4"/></svg>'
};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
async function copiar(texto,msg){try{await navigator.clipboard.writeText(texto);toast(msg)}catch(e){toast('El navegador bloqueó el portapapeles: selecciona el texto y copia con Ctrl+C')}}

/* RUT ficticio con dígito verificador real (módulo 11) */
function dv(b){let s=0,f=2;for(let i=String(b).length-1;i>=0;i--){s+=+String(b)[i]*f;f=f===7?2:f+1}const r=11-(s%11);return r===11?'0':r===10?'K':String(r)}

const pamC=c=>c.pas!=null&&c.pad!=null&&c.pas>c.pad?Math.round(c.pad+(c.pas-c.pad)/3):null;
const controlado=c=>CONTROLADOS.includes(c.modo);
const mecBloq=c=>c.asinc&&controlado(c);
const dpC=c=>!mecBloq(c)&&c.plat!=null&&c.peep!=null&&c.plat>c.peep?c.plat-c.peep:null;
const crsC=c=>{const d=dpC(c);return d&&c.vt?Math.round(c.vt/d*10)/10:null};

function spark(vals,labels,opt={}){
  const W=260,H=56,P=6,xs=vals.map((_,i)=>vals.length===1?W/2:P+i*(W-2*P)/(vals.length-1));
  const ok=vals.filter(v=>v!=null);if(!ok.length)return'<div class="small muted" style="height:56px;display:flex;align-items:center">Sin datos</div>';
  let lo=Math.min(...ok,opt.ref??Infinity),hi=Math.max(...ok,opt.ref??-Infinity);if(lo===hi){lo-=1;hi+=1}
  const pad=(hi-lo)*.15;lo-=pad;hi+=pad;const y=v=>H-P-((v-lo)/(hi-lo))*(H-2*P);
  let d='',gap=true;vals.forEach((v,i)=>{if(v==null){gap=true;return}d+=(gap?'M':'L')+xs[i].toFixed(1)+' '+y(v).toFixed(1)+' ';gap=false});
  const li=vals.map((v,i)=>v!=null?i:-1).filter(i=>i>=0).pop();
  const iso=vals.map((v,i)=>v!=null&&(i===0||vals[i-1]==null)&&(i===vals.length-1||vals[i+1]==null)&&i!==li?`<circle cx="${xs[i]}" cy="${y(v)}" r="3.5" fill="var(--accent)" stroke="var(--panel-2)" stroke-width="1.5"/>`:'').join('');
  const marks=iso+vals.map((v,i)=>v==null?(opt.lockAt&&opt.lockAt[i]?`<text x="${xs[i]}" y="${H/2+3}" text-anchor="middle" font-size="11" fill="var(--crit-ink)" font-weight="700">bloq.</text>`:''):'').join('');
  const ref=opt.ref!=null?`<line x1="${P}" x2="${W-P}" y1="${y(opt.ref)}" y2="${y(opt.ref)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-vals='${JSON.stringify(vals)}' data-labels='${JSON.stringify(labels)}' data-xs='${JSON.stringify(xs)}' data-unit="${esc(opt.unit||'')}">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/>${ref}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${marks}
    ${li!=null?`<circle cx="${xs[li]}" cy="${y(vals[li])}" r="4.5" fill="var(--accent)" stroke="var(--panel-2)" stroke-width="2"/>`:''}</svg>`;
}
document.addEventListener('pointermove',e=>{
  const svg=e.target.closest&&e.target.closest('.spark svg');$$('.tip').forEach(t=>t.remove());if(!svg)return;
  const r=svg.getBoundingClientRect(),vals=JSON.parse(svg.dataset.vals),xs=JSON.parse(svg.dataset.xs),lb=JSON.parse(svg.dataset.labels);
  const px=(e.clientX-r.left)/r.width*260;let bi=-1,bd=1e9;xs.forEach((x,i)=>{const dd=Math.abs(x-px);if(dd<bd){bd=dd;bi=i}});if(bi<0)return;
  const card=svg.closest('.spark'),cr=card.getBoundingClientRect(),t=document.createElement('div');t.className='tip mono';
  t.textContent=lb[bi]+' · '+(vals[bi]==null?'bloqueado / sin dato':vals[bi]+' '+svg.dataset.unit);
  t.style.left=(r.left-cr.left+xs[bi]/260*r.width)+'px';t.style.top=(r.top-cr.top-4)+'px';card.appendChild(t)});

function addEv(b,t,label){b.eventos.push({t,label,hora:hhmm(nowFor(b))})}
function applyEv(b,k,v){
  const hr=hhmm(nowFor(b));

   case'pvestart':b.pve=Date.now();addEv(b,k,'Inicio de PVE (30 min)');msg='PVE iniciada.';break;
   case'extub':b.via='NATURAL';b.extub='extubado '+hr;b.pve=null;addEv(b,k,'Extubación programada, queda en '+v.disp);break;
   case'reint':b.via=v.via||'TET';b.cal=v.cal||b.cal||'--';b.fij=v.fij||b.fij||'--';b.extub=null;addEv(b,k,`Reintubación ${b.via} calibre ${b.cal}, fijación ${b.fij} cm`);break;
   case'traq':b.via='TQT';b.cal=v.cal||b.cal||'--';b.fij='Collarín';addEv(b,k,'Traqueostomía calibre '+b.cal);break;
   case'ajuste':b.fij=v.cm||b.fij;addEv(b,k,`Ajuste de tubo a ${b.fij} cm (${v.mot})`);msg='Ajuste registrado. No suma como intubación.';break;
   case'autoext':alerta('Autoextubación','Autoextubación no planificada',v.disp);b.via='NATURAL';b.extub='autoextubado '+hr;b.pve=null;addEv(b,k,'AUTOEXTUBACIÓN NO PLANIFICADA, queda en '+v.disp);msg='Evento registrado. El PC ya muestra la alerta con el informe pre-llenado.';break;
   case'prono':b.prono=Date.now();addEv(b,k,'Inicio de prono');break;

   case'bnmini':b.bnm=v.far;addEv(b,k,'Inicio de bloqueo neuromuscular ('+v.far+')');break;
   case'bnmfin':b.bnm=null;addEv(b,k,'Suspensión de bloqueo neuromuscular');break;

   case'pcr':alerta('PCR','Paro cardiorrespiratorio, reanimación '+(v.min||'--')+' min');addEv(b,k,'PCR, reanimación '+(v.min||'--')+' min');msg='Evento registrado. El PC ya muestra la alerta con el informe pre-llenado.';break;
   case'cent':alerta('Evento centinela','Evento centinela: '+(v.txt||'sin descripción'));addEv(b,k,'Evento centinela: '+(v.txt||'sin descripción'));msg='Evento registrado. El PC ya muestra la alerta con el informe pre-llenado.';break}

function setField(k,v){const d=draftFor(bed(S.phoneBed));setF(d,k,String(v));const el=$('[data-k="'+k+'"]');if(el){el.value=String(v);el.dispatchEvent(new Event('input',{bubbles:true}))}}

function focusKey(k){const el=$('[data-k="'+k+'"]');if(el&&!el.disabled)el.focus()}
function kbAct(a,v){
  const b=bed(S.phoneBed),d=draftFor(b);
  if(a==='pickmodo'){S.kb='modo';renderKb();return}
  if(a==='kbchip'){
    if(S.kb==='modo'){d.modo=v;renderPhone();kbAct('kbnext');return}
    setField(S.kb,v);kbAct('kbnext');return}
  if(a==='kbnext'){
    const st=stopsList(),i=st.findIndex(x=>x.dataset.stop===S.kb),n=st[i+1];
    if(!n){closeKb();return}
    if(n.dataset.stop==='modo'){S.kb='modo';renderKb();n.scrollIntoView({block:'center',behavior:'smooth'})}else n.focus();
    return}
  if(a==='kbdone'){if(document.activeElement)document.activeElement.blur();closeKb();return}
  if(a==='kbkey'){
    const k=S.kb;let cur=String(getF(d,k)||'');const isEsc=/^sed:\w+:esc$/.test(k),isIms=k==='ims';
    if(v==='back')cur=cur.slice(0,-1);
    else if(isEsc){if(/^[1-6]$/.test(v))cur=v;else{toast('El escalón va del 1 al 6');return}}
    else if(isIms){const n=num(cur+v);cur=n!=null&&n<=10?cur+v:v}
    else if(v===','){if(!/[,.]/.test(cur))cur+=cur===''?'0,':','}

function saveControl(){
  const b=bed(S.phoneBed),d=draftFor(b),vis=modoKeys(d.modo),miss=[];
  [['fc','FC'],['pas','PAS'],['pad','PAD'],['spo2','SpO₂']].forEach(([k,l])=>{if(num(d[k])==null)miss.push(l)});
  if(vis.includes('fr')&&num(d.fr)==null)miss.push('FR');
  const any=SEDS.some(s=>d.sed[s.id].on);
  if(any&&!d.sas)miss.push('SAS');if(!any&&!d.vig)miss.push('estado de vigilia');
  SEDS.forEach(s=>{const x=d.sed[s.id];if(x.on&&num(x.libre?x.dosis:x.esc)==null)miss.push(s.n+(x.libre?': dosis':': escalón'))});
  if(d.nadOn&&num(d.nad)==null)miss.push('dosis de noradrenalina');
  if(d.vasoOn&&num(d.vaso)==null)miss.push('dosis de vasopresina');
  if(d.ktr===null)miss.push('kine respiratoria sí/no');
  if(d.tf===null)miss.push('terapia física');
  if(miss.length){toast('Falta: '+miss.join(', ')+'.');return}
  if(d.ktr&&!apkTurno(b)){S.phoneTab='kine';renderPhone();toast('Hiciste kine respiratoria: firma primero la APK de este turno.');return}
  const u=last(b),ts=Math.max(Date.now(),(u?.ts||0)+20*60000),g=k=>vis.includes(k)?num(d[k]):null,sed={};
  SEDS.forEach(s=>{const x=d.sed[s.id];if(x.on){const en=x.libre?null:num(x.esc);sed[s.id]={dosis:x.libre?num(x.dosis):escDosis(s,en),esc:en}}});
  const c={id:'c'+Math.random().toString(36).slice(2,8),ts,hora:hhmm(ts),fc:num(d.fc),pas:num(d.pas),pad:num(d.pad),spo2:num(d.spo2),fr:g('fr'),vt:g('vt'),pico:g('pico'),plat:g('plat'),pmed:g('pmed'),ps:g('ps'),flujo:g('flujo'),
    modo:d.modo,peep:g('peep'),fio:g('fio'),asinc:d.modo==='CNAF'?false:d.asinc,sedOn:any,sas:any?d.sas:null,vig:any?null:d.vig,sed,fent:sed.fent?sed.fent.dosis:0,
    nad:d.nadOn?num(d.nad)||0:0,vaso:d.vasoOn?num(d.vaso)||0:0,ktr:d.ktr,asp:d.ktr?d.asp:'No',secAsp:d.ktr?d.secAsp:null,secReo:d.ktr?d.secReo:null,secCant:d.ktr?d.secCant:null,
    tf:d.tf,acts:d.tf==='si'?[...d.acts]:[],ims:d.tf==='si'?num(d.ims):null,motivo:d.tf==='contra'?d.motivo:null,firma:'DM'};
  b.controles.push(c);resetDraft(b);S.kb=null;
  if(S.online){S.log.unshift(logRow(b,c));toast(`Guardado ${b.id} ${c.hora}. Ya aparece en el tablero del PC.`)}
  else{S.queue.push({b:b.id,c});toast('Sin señal: guardado en el teléfono. Se sube cuando vuelva la conexión.')}
  S.phoneTab='control';renderPhone();syncSide()}
function flushQueue(){if(!S.online||!S.queue.length)return;const n=S.queue.length;S.queue.forEach(q=>S.log.unshift(logRow(bed(q.b),q.c)));S.queue=[];toast(`Volvió la señal: se subieron ${n} control(es), sin duplicar.`)}

function phoneAct(a,v,ds){
  if(a==='pickmodo'||a.startsWith('kb')){kbAct(a,v);return}
  const b=bed(S.phoneBed),d=draftFor(b);
  switch(a){
   case'asinc':d.asinc=v==='1';renderPhone();break;
   case'demofill':{const vis=modoKeys(d.modo),ex={fc:'86',spo2:'97',pas:'122',pad:'68',fr:'18',vt:'450',pico:'22',plat:'18',pmed:'10'};
     Object.keys(ex).forEach(k=>{if(['fc','spo2','pas','pad'].includes(k)||vis.includes(k))d[k]=ex[k]});renderPhone();break}
   case'sas':d.sas=+v;renderPhone();break;
   case'vig':d.vig=v;renderPhone();break;
   case'play':d[v+'On']=true;renderPhone();focusKey(v);break;
   case'stop':d[v+'On']=false;d[v]='';renderPhone();break;
   case'splay':{const s=SEDS.find(z=>z.id===v),x=d.sed[v];x.on=true;if(s.libre)x.libre=true;renderPhone();focusKey('sed:'+v+':'+(x.libre?'dosis':'esc'));break}
   case'sstop':{const x=d.sed[v];x.on=false;x.esc='';x.dosis='';renderPhone();break}
   case'slibre':{const x=d.sed[v];x.libre=!x.libre;x.esc='';x.dosis='';renderPhone();if(x.on)focusKey('sed:'+v+':'+(x.libre?'dosis':'esc'));break}
   case'ktr':d.ktr=v==='1';if(!d.ktr){d.asp='No';d.secAsp=d.secReo=d.secCant=null}renderPhone();break;
   case'asp':d.asp=v;renderPhone();break;
   case'sec':d[ds.g]=d[ds.g]===v?null:v;renderPhone();break;
   case'tf':d.tf=v;renderPhone();break;
   case'motivo':d.motivo=v;renderPhone();break;
   case'apk':{const hr=hhmm(nowFor(b));b.apk.push({turno:'actual',ok:true,hora:hr,por:'Klgo. Diego Melo',
      texto:`Declaro haber verificado los criterios de seguridad de la pauta APK (perfil ${artificial(b)?'vía aérea artificial':'vía aérea natural'}) y no encontrar contraindicación. Klgo. Diego Melo · ${hr} hrs.`});
     toast('APK de este turno firmada. Vale para los controles siguientes.');renderPhone();break}
   case'apkno':S.apkNo=!S.apkNo;renderPhone();break;
   case'apkno-ok':{const ch=$$('[data-act="apkchk"]:checked').map(x=>pauta(b)[+x.dataset.v]);
     if(!ch.length){toast('Marca qué criterio no se cumple.');break}
     const hr=hhmm(nowFor(b));b.apk.push({turno:'actual',ok:false,hora:hr,por:'Klgo. Diego Melo',texto:`NO CUMPLE. Impide el procedimiento: ${ch.join('; ')}. Kinesiterapia respiratoria diferida.`});
     S.apkNo=false;d.ktr=false;d.asp='No';renderPhone();break}
   case'pvefin':b.eventos.push({t:'FIN_PVE',label:'Fin de PVE: '+(v==='1'?'tolerada':'no tolerada'),hora:hhmm(nowFor(b))});b.pve=null;toast('PVE '+(v==='1'?'tolerada':'no tolerada')+' registrada.');renderPhone();break;
   case'ev':{const it=evFind(b,v);if(!it)break;if(it.f)S.evForm=v;else applyEv(b,v,{});renderPhone();break}
   case'evok':{const it=evFind(b,S.evForm),vals={};((it&&it.f)||[]).forEach(f=>{const el=$('#evf-'+f.id);vals[f.id]=el?el.value:''});applyEv(b,S.evForm,vals);S.evForm=null;renderPhone();break}
   case'evcancel':S.evForm=null;renderPhone();break;
   case'save':saveControl();break}
  if(a!=='save')syncSide()}

  const k=clsModo(c.modo),f=[['SAS',c.sedOn?c.sas:'—'],['Modo',c.modo]];
  if(k==='ps')f.push(['FR total',c.fr]);else if(k)f.push(['FR programada',c.fr]);
  if(k==='ac')f.push(['Vol. Corriente Programado',c.vt]);else if(k)f.push(['Espirado',c.vt]);
  f.push(['Vol. Minuto',c.vt&&c.fr?Math.round(c.vt*c.fr/100)/10:null],['P. Pico',c.pico],['Meseta (Pº Media)',c.pmed]);
  if(k==='ps')f.push(['Soporte',c.ps]);else if(k==='pc')f.push(['Control',c.ps]);
  f.push(['PEEP Programado',c.peep],['FiO2 Programado',c.fio],['I:E',null],['Compliance Estática',mecBloq(c)?'no valorable (asincronía)':crsC(c)],['Auto PEEP',null],['SpO2',c.spo2],
   ['Comentarios',[c.flujo!=null?'Flujo '+c.flujo+' L/min':'',c.plat!=null&&!mecBloq(c)?'P. Plateau '+c.plat:'',dpC(c)!=null?'P. Distensión '+dpC(c):''].filter(Boolean).join(' · ')]);
  return f.map(([l,v])=>[l,v==null||v===''?'en blanco':String(v)])}
function renderAlma(){
  const b=bed(S.pcBed);const cs=b.controles;
  if(!cs.find(c=>c.id===S.almaCtl))S.almaCtl=cs[cs.length-1]?.id||null;
  const c=cs.find(x=>x.id===S.almaCtl);const camp=c?almaCampos(c):[];const i=Math.min(S.almaIdx,camp.length);const fin=c&&i>=camp.length;
  $('#view').innerHTML=`<p class="intro">Dos formas de pasar la información a ALMA: <b>paso a paso</b> (un panel angosto al lado de ALMA, un registro por control) o <b>copiar la evolución</b> completa. <span class="tag-new">idea de tu colega: panel paso a paso</span></p>
  <div class="pc-bar"><div class="row">${beds.filter(x=>x.mine).map(x=>`<button class="chip" data-pcbed2="${x.id}" aria-pressed="${x.id===b.id}">${x.id}</button>`).join('')}</div></div>
  <div class="alma"><div class="card stack">
    <h2>Para ALMA · ${b.id}</h2>
    ${cs.length?`<div class="row">${cs.map(x=>`<button class="chip" data-almactl="${x.id}" aria-pressed="${x.id===S.almaCtl}">${x.hora}</button>`).join('')}</div>`:'<p class="muted">Esta cama no tiene controles.</p>'}
    ${c?`${fin?`<div class="notice good"><b>Control de las ${c.hora} revisado.</b><br>Falta firmar en ALMA con tu usuario.</div><button class="btn" data-act="alma-reset">Empezar de nuevo</button>`
     :`<div><div class="small muted">${i+1} de ${camp.length}</div><div class="bar"><i style="width:${(i/camp.length)*100}%"></i></div><div class="small ink2" style="margin-top:8px">Campo de ALMA</div><div style="font-weight:700">${camp[i][0]}</div><div class="step-val ${camp[i][1]==='en blanco'?'muted':''}">${esc(camp[i][1])}</div></div>
      <div class="row"><button class="btn" data-act="alma-prev" ${i===0?'disabled':''}>Atrás</button><button class="btn primary" data-act="alma-next">Listo, siguiente</button></div>`}
     <ul class="flist">${camp.map(([l,v],j)=>`<li class="${j===i&&!fin?'on':j<i?'done':''}"><span>${j<i?ic.check+' ':''}${l}</span><span class="mono">${esc(v)}</span></li>`).join('')}</ul>
     <p class="small muted">Orden de campos y regla por modo (ACVC / PCV / CPAP+PS) tomados de la propuesta de tu colega. Es un esquema, no la pantalla real de ALMA.</p>`:''}
  </div>
  <div class="card stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Evolución para copiar</h2>
    <div class="seg"><button data-nota="turno" aria-pressed="${S.notaModo==='turno'}">Turno completo</button><button data-nota="ultima" aria-pressed="${S.notaModo==='ultima'}">Última atención</button></div></div>
   <pre class="nota" id="notaTxt">${esc(notaTexto(b,S.notaModo))}</pre>
   <div class="row"><button class="btn primary" data-act="copy-nota" ${cs.length?'':'disabled'}>Copiar evolución para ALMA</button>
    <span class="pill ${b.transc?'good':''}">${b.transc?ic.check+' Transcrito '+b.transc:'Pendiente'}</span></div>
   <p class="small muted">Copiarla deja la cama en “Transcrito” con la hora. Dice que se copió, no que ALMA la recibió.</p></div></div>`}

/* ============ vista: DATOS ============ */
function renderDatos(){
  const ids=beds.map(b=>({ep:'ep-'+b.id.slice(-2),cama:b.id,nombre:b.nombre,rut:rutF(b.rutB)}));
  $('#view').innerHTML=`<p class="intro">Qué se guarda y dónde. Todo vive en una hoja de Google, en <b>dos canales con llaves distintas</b>. Lo que guardaste en la pestaña 1 aparece abajo, en la hoja de controles.</p>
  <div class="flow">
   <div class="node"><h2><span class="pill acc">Celular</span> llave de app</h2><p class="small ink2">Escribe controles, eventos y APK. Lee solo lo clínico. No tiene la llave de estación.</p></div>
   <div class="node"><h2><span class="pill acc">PC de la UCI</span> llave de estación</h2><p class="small ink2">Lee todo y además la hoja de identidad. La llave se guarda en el navegador desde un marcador, sin tipearla por turno.</p></div>
   <div class="node"><h2><span class="pill">Alta del paciente</span> purga</h2><p class="small ink2">Se borra su fila de identidad. Lo clínico queda sin nombre para las estadísticas.</p></div></div>
  <div class="card stack" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Hoja CONTROLES · sin nombre ni RUT</h2><span class="pill">${S.log.length} filas</span></div>
   <div class="scroll-x"><table class="sab sheet"><thead><tr>${['ID_CONTROL','ID_CAMA','PATIENT_ID','GUARDADO','FC','PA','SPO2','MODO','PEEP','FIRMA'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
    ${S.log.slice(0,8).map(r=>`<tr><td>${r.id}</td><td>${r.cama}</td><td>${r.ep}</td><td>${r.guardado}</td><td>${fmt(r.fc)}</td><td>${r.pa}</td><td>${fmt(r.spo2)}</td><td>${r.modo}</td><td>${fmt(r.peep)}</td><td>${r.firma}</td></tr>`).join('')}</tbody></table></div>
   <p class="small muted">El ID del control nace en el teléfono: si la subida se corta y se reintenta, no se duplica. Nada se borra; una corrección es una fila nueva que anula la anterior. <span class="tag-new">idea de tu colega</span></p></div>
  <div class="card stack" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Hoja IDENTIDAD · solo con llave de estación</h2><span class="pill crit">${ic.lock} sensible</span></div>
   <div class="scroll-x"><table class="sab sheet"><thead><tr>${['PATIENT_ID','ID_CAMA','NOMBRE','RUT'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${ids.slice(0,5).map(r=>`<tr><td>${r.ep}</td><td>${r.cama}</td><td>${r.nombre}</td><td>${r.rut}</td></tr>`).join('')}</tbody></table></div>
   <div class="row"><button class="btn" data-act="api-cel">Pedir identidad desde un celular</button><button class="btn" data-act="api-pc">Pedir identidad desde un PC</button><span class="small muted">Simulación</span></div>
   ${S.apiTest?`<div class="keyline">${esc(S.apiTest)}</div>`:''}
   <p class="small muted">Riesgo aceptado por el equipo: la identidad vive en Google para estar disponible en cualquier PC y abrir Sinapse por RUT. Apps Script no puede filtrar por IP, por eso las defensas son la llave aparte, la hoja aparte y la purga.</p></div>
  <div class="card" style="margin-top:16px"><h2>Qué tomé de la propuesta de tu colega, y qué queda por decidir</h2>
   <div class="sparks" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
    <div><h3>Lo que incorporé</h3><ul class="small ink2" style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Hojas CONTROLES y HOJA_DIA nuevas, sin tocar las existentes.</li><li>ID desde el teléfono y anulación sin borrar.</li><li>Panel “Para ALMA” paso a paso, con regla por modo.</li><li>Interruptor para apagar todo y volver a como está hoy.</li></ul></div>
    <div><h3>Por decidir</h3><ul class="small ink2" style="margin:0;padding-left:18px;display:grid;gap:4px"><li>DVA: casilleros libres de tu colega o dosis numérica con semáforo, como aquí.</li><li>Eventos: tu colega los deja solo en la evolución; aquí cuentan para REM y para el informe de riesgo.</li><li>Formato de URL de Sinapse para el botón.</li></ul></div></div></div>`}

/* ============ eventos globales y arranque ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-tab],[data-pcbed]');if(!t)return;const ds=t.dataset;
  if(ds.tab){go(ds.tab);return}
  if(ds.ptab){S.phoneTab=ds.ptab;S.evForm=null;S.kb=null;renderPhone();return}
  if(ds.bed){S.phoneBed=ds.bed;S.phoneTab='control';S.evForm=null;S.apkNo=false;S.kb=null;renderPhone();syncSide();return}
  if(ds.pcbed){S.pcBed=ds.pcbed;S.almaIdx=0;S.almaCtl=null;renderTablero();return}
  if(ds.pcbed2){S.pcBed=ds.pcbed2;S.almaIdx=0;S.almaCtl=null;renderAlma();return}
  if(ds.filtro){S.filtro=ds.filtro;renderTablero();return}
  if(ds.almactl){S.almaCtl=ds.almactl;S.almaIdx=0;renderAlma();return}
  if(ds.nota){S.notaModo=ds.nota;renderAlma();return}
  const a=ds.act;if(!a)return;
  if(t.closest('#phone')){phoneAct(a,ds.v,ds);return}
  const b=bed(S.pcBed);
  switch(a){
   case'copy-riesgo':copiar(riesgoTexto(b),'Informe de riesgo copiado');break;
   case'copy-nota':copiar(notaTexto(b,S.notaModo),'Evolución copiada. Pégala en ALMA.');b.transc=hhmm(nowFor(b));renderAlma();break;
   case'alma-next':S.almaIdx++;renderAlma();break;
   case'alma-prev':S.almaIdx=Math.max(0,S.almaIdx-1);renderAlma();break;
   case'alma-reset':S.almaIdx=0;renderAlma();break;
   case'api-cel':S.apiTest='GET ?recurso=identidad&token=APP_TOKEN\n→ {"ok":false,"error":"TOKEN_INVALIDO"}';renderDatos();break;
   case'api-pc':S.apiTest='GET ?recurso=identidad&token=STATION_TOKEN\n→ {"ok":true,"identidades":['+beds.length+' filas]}';renderDatos();break}});

function go(tab){S.tab=tab;if(location.hash!=='#'+tab)history.replaceState(null,'','#'+tab);
  $$('.tab').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.tab===tab)));
  ({celular:renderCelular,tablero:renderTablero,alma:renderAlma,datos:renderDatos})[tab]()}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['celular','tablero','alma','datos'].includes(h)&&h!==S.tab)go(h)});
go(['celular','tablero','alma','datos'].includes(location.hash.slice(1))?location.hash.slice(1):'celular');
</script>
